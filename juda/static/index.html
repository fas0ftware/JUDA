<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>JUDA</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1b1f27; --muted: #6a7280;
    --accent: #2f6fed; --on: #1f9d55; --off: #98a1b0; --danger: #d64545; --border: #e1e4ea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --card: #1b2029; --text: #e8ebf0; --muted: #98a1b0;
            --accent: #6a9bff; --on: #3ec877; --off: #6a7280; --danger: #ff7a7a; --border: #2a303c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
          padding: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; }
  input[type=text], input[type=password] { flex: 1; min-width: 0; padding: 12px; font-size: 1rem;
          border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); }
  button { padding: 10px 14px; font-size: .95rem; border: 0; border-radius: 10px;
           background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  button:disabled { opacity: .5; }
  #reply { margin-top: 10px; min-height: 1.4em; }
  #reply.err { color: var(--danger); }
  .dev { display: flex; align-items: center; justify-content: space-between; gap: 10px;
         padding: 10px 0; border-top: 1px solid var(--border); }
  .dev:first-child { border-top: 0; }
  .dev .name { font-weight: 600; }
  .dev .state { font-size: .85rem; color: var(--muted); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--off); }
  .dot.on { background: var(--on); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>JUDA</h1>
  <p class="sub" id="who">Akıllı ev asistanı (prototip)</p>

  <section class="card" id="login">
    <label for="token">Erişim anahtarı</label>
    <div class="row" style="margin-top:8px">
      <input type="password" id="token" autocomplete="off" placeholder="Token">
      <button id="loginBtn">Giriş</button>
    </div>
    <div id="loginErr" class="sub" style="color:var(--danger)"></div>
  </section>

  <div id="app" class="hidden">
    <section class="card">
      <div class="row">
        <input type="text" id="cmd" placeholder="Örn: salon ışığını aç" autocomplete="off">
        <button id="send">Gönder</button>
      </div>
      <div class="chips" id="chips"></div>
      <div id="reply"></div>
    </section>

    <section class="card" id="devices"></section>
    <section class="card hidden" id="schedules"></section>
    <button class="ghost" id="logout">Çıkış</button>
  </div>
</main>

<script>
(function () {
  var token = null;
  try { token = localStorage.getItem("juda_token"); } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var role = null;

  var SUGGESTIONS = ["Eve geldim", "Tüm ışıkları kapat", "Klimayı 23 derece yap", "Kapıyı kilitle", "Durum", "İyi geceler", "Saat 23:00'te tüm ışıkları kapat"];

  function api(method, path, body) {
    var opts = { method: method, headers: { "Authorization": "Bearer " + token } };
    if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, data: j }; });
    });
  }

  function setReply(text, isErr) {
    var el = $("reply");
    el.textContent = text;
    el.className = isErr ? "err" : "";
  }

  function stateText(d) {
    var s = d.state;
    if (d.kind === "light") return s.on ? "Açık · %" + s.brightness : "Kapalı";
    if (d.kind === "thermostat") return (s.on ? "Açık · hedef " + s.target + "°C" : "Kapalı") + " · oda " + s.current + "°C";
    if (d.kind === "lock") return s.locked ? "Kilitli" : "Açık";
    if (d.kind === "plug") return s.on ? "Açık" : "Kapalı";
    return "";
  }

  function isActive(d) {
    return d.kind === "lock" ? !d.state.locked : !!d.state.on;
  }

  function toggleAction(d) {
    if (d.kind === "lock") return d.state.locked ? "unlock" : "lock";
    return d.state.on ? "off" : "on";
  }

  function toggleLabel(d) {
    if (d.kind === "lock") return d.state.locked ? "Kilidi aç" : "Kilitle";
    return d.state.on ? "Kapat" : "Aç";
  }

  function renderDevices(list) {
    var box = $("devices");
    box.textContent = "";
    list.forEach(function (d) {
      var row = document.createElement("div"); row.className = "dev";
      var left = document.createElement("div");
      var name = document.createElement("div"); name.className = "name";
      var dot = document.createElement("span"); dot.className = "dot" + (isActive(d) ? " on" : "");
      name.appendChild(dot); name.appendChild(document.createTextNode(d.name));
      var st = document.createElement("div"); st.className = "state"; st.textContent = stateText(d);
      left.appendChild(name); left.appendChild(st);
      var btn = document.createElement("button"); btn.textContent = toggleLabel(d);
      btn.addEventListener("click", function () {
        btn.disabled = true;
        api("POST", "/api/device", { id: d.id, action: toggleAction(d) }).then(function (r) {
          setReply(r.data.text || r.data.error, !(r.data.ok));
          refresh();
        });
      });
      row.appendChild(left); row.appendChild(btn);
      box.appendChild(row);
    });
  }

  function renderSchedules(list) {
    var box = $("schedules");
    box.textContent = "";
    box.classList.toggle("hidden", list.length === 0);
    if (list.length === 0) return;
    var title = document.createElement("div"); title.className = "name"; title.textContent = "Zamanlamalar";
    box.appendChild(title);
    list.forEach(function (j) {
      var row = document.createElement("div"); row.className = "dev";
      var left = document.createElement("div");
      var name = document.createElement("div"); name.className = "name";
      name.textContent = "#" + j.id + " " + j.text;  // textContent: user text is never parsed as HTML
      var st = document.createElement("div"); st.className = "state";
      st.textContent = (j.daily ? "her gün, " : "") + "sıradaki: " + j.next_run + " · " + j.user;
      left.appendChild(name); left.appendChild(st);
      var btn = document.createElement("button"); btn.className = "ghost"; btn.textContent = "İptal";
      btn.addEventListener("click", function () {
        btn.disabled = true;
        api("DELETE", "/api/schedules/" + encodeURIComponent(j.id)).then(refresh);
      });
      row.appendChild(left); row.appendChild(btn);
      box.appendChild(row);
    });
  }

  function refresh() {
    api("GET", "/api/schedules").then(function (r) {
      if (r.status === 200) renderSchedules(r.data.schedules || []);
    });
    return api("GET", "/api/devices").then(function (r) {
      if (r.status === 401) { logout(); return; }
      renderDevices(r.data.devices || []);
    });
  }

  function send() {
    var text = $("cmd").value.trim();
    if (!text) return;
    $("send").disabled = true;
    api("POST", "/api/command", { text: text }).then(function (r) {
      setReply(r.data.text || r.data.error, !(r.data.ok));
      $("cmd").value = "";
      return refresh();
    }).catch(function () { setReply("Sunucuya ulaşılamadı.", true); })
      .then(function () { $("send").disabled = false; });
  }

  function showApp() {
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    api("GET", "/api/me").then(function (r) {
      if (r.status === 200) {
        role = r.data.role;
        $("who").textContent = r.data.name + " (" + r.data.role + ")";
      }
    });
    refresh();
  }

  function logout() {
    token = null;
    try { localStorage.removeItem("juda_token"); } catch (e) {}
    $("app").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("who").textContent = "Akıllı ev asistanı (prototip)";
  }

  function login() {
    var t = $("token").value.trim();
    if (!t) return;
    token = t;
    api("GET", "/api/me").then(function (r) {
      if (r.status === 200) {
        try { localStorage.setItem("juda_token", t); } catch (e) {}
        $("loginErr").textContent = "";
        $("token").value = "";
        showApp();
      } else {
        token = null;
        $("loginErr").textContent = "Token geçersiz.";
      }
    }).catch(function () { $("loginErr").textContent = "Sunucuya ulaşılamadı."; });
  }

  SUGGESTIONS.forEach(function (s) {
    var b = document.createElement("button"); b.className = "ghost"; b.textContent = s;
    b.addEventListener("click", function () { $("cmd").value = s; send(); });
    $("chips").appendChild(b);
  });

  $("loginBtn").addEventListener("click", login);
  $("token").addEventListener("keydown", function (e) { if (e.key === "Enter") login(); });
  $("send").addEventListener("click", send);
  $("cmd").addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });
  $("logout").addEventListener("click", logout);

  if (token) { showApp(); }
})();
</script>
</body>
</html>
